<script>
const $=id=>document.getElementById(id);
const out=$('out'),inp=$('inp'),row=$('row'),scr=$('scr'),term=$('term');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const k=s=>`<span class="k">${s}</span>`,dm=s=>`<span class="d">${s}</span>`;
const RESUME_URL=''; /* paste your resume link here */
let hist=[],hi=0,dead=false,busy=true,tokens=6,last=Date.now();
let jwt=null,role=null;
const LAYERS=['Client','Filter chain','Controller','Service','Repository','PostgreSQL'];
const TXT={200:'OK',401:'Unauthorized',403:'Forbidden',404:'Not Found',405:'Method Not Allowed'};
function auth(lc){
  if(lc==='logout'){jwt=role=null;print(dm('Token discarded. You are anonymous again.'));return}
  role=lc==='login admin'?'ADMIN':'USER';
  jwt='eyJhbGciOiJIUzI1NiJ9.'+btoa(JSON.stringify({sub:'visitor',role})).replace(/=/g,'')+'.sig';
  print(`<span class="ok">200 OK</span> POST /login → JWT issued (role ${k(role)})`);
  print(dm(jwt.slice(0,44)+'…'));
  print(dm('Requests now carry the token. Try: curl localhost:8080/api/admin'));
}
async function trace(m,path,steps,status,body){
  const id='tr'+Date.now();
  print(`${dm('→')} ${k(m)} ${esc(path)} ${dm('(Authorization: '+(jwt?'Bearer …':'none')+')')}`);
  print(`<div class="tr" id="${id}">`+LAYERS.map(n=>`<span class="nd">${n}</span>`).join('<span class="ar">→</span>')+'</div>');
  const nodes=[...document.querySelectorAll('#'+id+' .nd')];
  nodes[0].classList.add('on');
  let last=0;
  for(const s of steps){
    await sleep(420);
    nodes[s.l].classList.add(s.bad?'bad':'on');
    print(`  ${dm('['+LAYERS[s.l].toLowerCase()+']')} ${s.log}`,s.bad?'e':'');
    last=s.l;if(s.bad)break;
  }
  await sleep(350);
  for(let i=last;i>=0;i--){const n=nodes[i];if(!n.classList.contains('bad')){n.classList.remove('on');if(status<400)n.classList.add('ok')}await sleep(140)}
  print(`<span class="${status<400?'ok':'e'}">HTTP/1.1 ${status} ${TXT[status]}</span>`);
  print(esc(JSON.stringify(body)));
}
async function curl(cmd){
  const t=cmd.split(/\s+/).slice(1);let m='GET',u='';
  for(let i=0;i<t.length;i++){const a=t[i];if(a==='-X'||a==='--request')m=(t[++i]||'GET').toUpperCase();else if(a==='-H'||a==='-d'||a==='--data')i++;else if(!a.startsWith('-'))u=a}
  const p=(u.replace(/^https?:\/\//,'').replace(/^localhost:8080/,'').replace(/\/+$/,'')||'/').toLowerCase();
  const f=jwt?`JwtAuthFilter: token valid, role ${k(role)}`:'JwtAuthFilter: public route, no token needed';
  const deny=need=>{if(!jwt)return [[{l:1,log:'JwtAuthFilter: no Authorization header → reject',bad:1}],401,{error:'Unauthorized'}];if(need&&role!==need)return [[{l:1,log:`JwtAuthFilter: token valid, but role ${role} lacks ${need} → reject`,bad:1}],403,{error:'Forbidden'}];return null};
  const names=['Vaultify','URL Shortener','Task Manager','API Rate Limiter','Prompt-to-App AI Platform'];
  const ro=m!=='GET'&&(['/health','/api/skills','/api/projects'].includes(p)||p.startsWith('/api/projects/'));
  let r;
  if(ro)r=deny('ADMIN')||[[{l:1,log:f},{l:2,log:`${m} is not mapped on this route → 405`,bad:1}],405,{error:'Method Not Allowed'}];
  else if(p==='/health')r=[[{l:1,log:f},{l:2,log:'HealthEndpoint.health()'}],200,{status:'UP'}];
  else if(p==='/api/skills')r=[[{l:1,log:f},{l:2,log:'SkillController.list()'},{l:3,log:'SkillService.findAll()'},{l:4,log:'SkillRepository.findAll()'},{l:5,log:'SELECT * FROM skills → 4 rows'}],200,{language:['Java','C','Python','SQL'],framework:['Spring Boot','Spring Security','JPA/Hibernate'],data:['PostgreSQL','Redis'],agents:['Google ADK','A2A']}];
  else if(p==='/api/projects')r=[[{l:1,log:f},{l:2,log:'ProjectController.list()'},{l:3,log:'ProjectService.findAll()'},{l:4,log:'ProjectRepository.findAll()'},{l:5,log:'SELECT * FROM projects → 5 rows'}],200,names];
  else if(p.startsWith('/api/projects/')){
    const key=p.slice(14),pk=ALIAS[key]||key;
    if(PROJ[pk])r=[[{l:1,log:f},{l:2,log:`ProjectController.get("${esc(key)}")`},{l:3,log:'ProjectService.find()'},{l:4,log:'ProjectRepository.findByName()'},{l:5,log:'SELECT * FROM projects WHERE name = ? → 1 row'}],200,{project:key,hint:'run: project '+key}];
    else r=[[{l:1,log:f},{l:2,log:`ProjectController.get("${esc(key)}")`},{l:3,log:'ProjectService throws ProjectNotFoundException, @RestControllerAdvice maps it to 404',bad:1}],404,{error:'Project not found'}];
  }
  else if(p==='/api/admin')r=deny('ADMIN')||[[{l:1,log:f},{l:2,log:'AdminController.panel()'},{l:3,log:'AdminService.secret()'},{l:4,log:'AdminRepository.find()'},{l:5,log:'SELECT message FROM admin → 1 row'}],200,{message:'You found the admin panel. Now go email me.'}];
  else r=[[{l:1,log:f},{l:2,log:'DispatcherServlet: no handler mapped → 404',bad:1}],404,{error:'Not Found'}];
  await trace(m,p,...r);
}

function lift(){

  const L={els,tx:0,ty:-30,c:els.map(()=>({x:0,y:0})),t0:now0,last:now0,raf:0};
  els.forEach(e=>{e.style.transition='';e.style.willChange='transform'});
  const lim=()=>[Math.min(scr.clientWidth*.3,260),Math.min(scr.clientHeight*.4,300)];
  const cl=(v,m)=>Math.max(-m,Math.min(m,v));
  L.move=(dx,dy)=>{const[mx,my]=lim();L.tx=cl(L.tx+dx,mx);L.ty=cl(L.ty+dy,my);L.last=performance.now()};
  L.to=(cx,cy)=>{const[mx,my]=lim();L.tx=cl((cx-innerWidth/2)*.5,mx);L.ty=cl((cy-innerHeight/2)*.5,my);L.last=performance.now()};
  const tick=now=>{
    const t=(now-L.t0)/1000;
    els.forEach((e,i)=>{
      const c=L.c[i],gx=i?L.c[i-1].x:L.tx,gy=i?L.c[i-1].y:L.ty;
      c.x+=(gx-c.x)*.14;c.y+=(gy-c.y)*.14;

  if(coverEl&&coverEl.isConnected){const c=coverEl;coverEl=null;print(dm('The cover fades away…'));c.classList.add('fade');await sleep(1400);c.remove()}
  await openMap();
}
async function closeMap(){
  const d=anyMap();
  if(!d){print(`${k('Mischief managed.')} ${dm('(Nothing was open.)')}`);return}
  d.dead=true;if(d===mapEl)mapEl=null;else coverEl=null;
  d.classList.add('fade');await sleep(1200);d.remove();print(k('Mischief managed.'));
}
const DUCK=[['     __       ','   <(o )___   ','    (  ._> /  ','     (____)   ','     d  b     '],['     __       ','   <(o )___   ','    (  ._> /  ','     (____)   ','      d b     ']];
async function patronus(){
  const fr=DUCK,h=fr[0].length,blank=' '.repeat(14);
  const pre=document.createElement('pre');pre.className='pat';document.body.appendChild(pre);
  const set=rows=>{pre.textContent=rows.join('\n')};
  term.style.filter='brightness(.55)';
  for(let i=0;i<6;i++){set(Array.from({length:h},()=>Array.from({length:14},()=>Math.random()<.12?".:~*,"[Math.random()*5|0]:' ').join('')));await sleep(110)}
  for(let n=1;n<=h;n++){set([...Array(h-n).fill(blank),...fr[0].slice(h-n)]);await sleep(220)}
  pre.classList.add('glow');await sleep(900);
  const go=pre.animate([{left:'6%'},{left:'100%'}],{duration:3600,easing:'ease-in-out',fill:'forwards'});
  let f=0;
  const iv=setInterval(()=>{f^=1;set(fr[f]);const r=pre.getBoundingClientRect(),s=document.createElement('span');s.className='spk';s.textContent=Math.random()<.5?'*':'.';s.style.left=(r.left+Math.random()*30)+'px';s.style.top=(r.top+Math.random()*r.height)+'px';document.body.appendChild(s);s.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(18px)'}],{duration:900}).onfinish=()=>s.remove()},180);
  await go.finished;clearInterval(iv);
  pre.animate([{opacity:1},{opacity:0}],{duration:600,fill:'forwards'});await sleep(600);
  pre.remove();term.style.filter='';
  print(`A Patronus of your own. ${dm('Happy thought: git push with no merge conflicts.')}`);
}

async function avada(){
  busy=true;row.classList.add('off');
  print(`${k('Avada Kedavra!')}`,'ok');
  const f=$('fl');f.classList.add('go');await sleep(500);f.classList.remove('go');
  scr.classList.add('glitch');await sleep(800);scr.classList.remove('glitch');
  const ls=[...out.children];
  ls.forEach((el,i)=>{el.style.animation=`fall .9s ${Math.min(i*30,900)}ms ease-in forwards`});
  await sleep(900+Math.min(ls.length*30,900));
  term.classList.add('crt');await sleep(950);
  out.innerHTML='';term.style.visibility='hidden';await sleep(700);
  term.classList.remove('crt');term.style.visibility='';
  dead=true;
  print('410 Gone. Terminal is dead.','e');print(`Type ${k('reparo')} to bring it back.`);
  row.classList.remove('off');busy=false;inp.focus();
}
async function revive(){dead=false;out.innerHTML='';print(`${k('Reparo!')} Terminal restored. <span class="ok">200 OK</span>`);print(dm('Type /help.'))}

async function run(raw,auto){
  const cmd=raw.trim(),lc=cmd.toLowerCase().replace(/\s+/g,' ').replace(/[.!]+$/,'').replace(/[’']/g,'');
  print(`<span class="p">kaustub@api</span>:<span class="pa">~</span>$ ${esc(cmd)}`);
  if(!cmd)return;
  if(!auto)hist.push(cmd);hi=hist.length;
  if(dead){lc==='reparo'?await revive():print(`410 Gone. Try ${k('reparo')}.`,'e');return}
  if(!auto&&!take()){print(`<span class="e">429 Too Many Spells.</span> Token bucket empty, refills 1 token every 1.5s.`);return}
  if(lc==='clear'||lc==='cls'){out.innerHTML='';return}
  if(spells[lc]){await spells[lc]();return}
  if(lc==='login'||lc==='login admin'||lc==='logout'){auth(lc);return}
  if(lc==='enter'||lc.startsWith('enter ')){const rm=ROOMS.find(x=>x.n.toLowerCase()===lc.slice(6).trim());if(!mapSeen)print(`<span class="e">404 No Such Door.</span> ${dm('A map might show one.')}`);else if(!rm)print(`<span class="e">404 No Such Room.</span> ${dm('The map has the names.')}`);else{print(dm(`You push open the door of the ${rm.n}…`));rm.f();const sm=mapEl&&mapEl.isConnected&&mapEl.summon&&mapEl.summon(ROOMS.indexOf(rm));if(sm)print(dm(sm))}return}
  if(lc.startsWith('curl ')){await curl(cmd);return}
  if(H[lc]){H[lc]();return}
  if(lc.startsWith('project ')){const key=lc.slice(8).trim();const p=PROJ[ALIAS[key]||key];p?print(p):print(`<span class="e">404 Project Not Found.</span> Try ${k('projects')}.`);return}
  if(lc==='sudo hire kaustub'){print(`<span class="ok">200 OK.</span> Imperius curse accepted. Candidate hired. ${dm('(Offer letter pending HR.)')}`);return}
  if(lc.startsWith('sudo')){print(`<span class="e">403 Forbidden.</span> You are not in the sudoers file. This incident will be reported.`);return}
  if(/rm\s+-rf/.test(lc)){print(`Nice try. The Ministry of Magic has been notified.`,'e');return}
  if(lc==='ls'){print('skills  projects  experience  achievements  contact');return}
  if(lc==='exit'){print(dm('exit: too many open loops, cannot exit'));return}
  const near=[...CMDS,...SPELLKEYS].find(c=>c.startsWith(lc.slice(0,3))&&lc.length>=3);
  print(`<span class="e">404 Spell Not Found:</span> ${esc(cmd)}${near?` ${dm('Did you mean')} ${k(near)}${dm('?')}`:''}`)
}

inp.addEventListener('keydown',async e=>{
  if(e.key==='Escape'&&anyMap()&&!busy){e.preventDefault();closeMap();return}
  if(lev){if(e.key==='Escape'){e.preventDefault();drop();return}const a={ArrowLeft:[-40,0],ArrowRight:[40,0],ArrowUp:[0,-40],ArrowDown:[0,40]}[e.key];if(a){e.preventDefault();lev.move(a[0],a[1]);return}lev.last=performance.now()}
  if(busy&&e.key!=='Tab')return;
  if(e.key==='Enter'){e.preventDefault();const v=inp.value;inp.value='';busy=true;row.classList.add('off');await run(v,false);if(!dead||true){row.classList.remove('off');busy=false;inp.focus()}}
  else if(e.key==='ArrowUp'){e.preventDefault();if(hi>0)inp.value=hist[--hi]}
  else if(e.key==='ArrowDown'){e.preventDefault();hi<hist.length-1?inp.value=hist[++hi]:(hi=hist.length,inp.value='')}
  else if(e.key==='Tab'){e.preventDefault();const v=inp.value.toLowerCase();if(!v)return;const m=[...CMDS,...SPELLKEYS].filter(c=>c.startsWith(v));if(m.length===1)inp.value=m[0];else if(m.length>1)print(m.map(k).join('  '))}
  else if(e.key==='l'&&e.ctrlKey){e.preventDefault();out.innerHTML=''}
});
scr.addEventListener('click',()=>{if(!getSelection().toString())inp.focus()});
document.addEventListener('mousemove',e=>{if(lev)lev.to(e.clientX,e.clientY)});
document.addEventListener('touchmove',e=>{if(lev&&e.touches[0])lev.to(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
document.addEventListener('mousedown',()=>{if(lev)drop()});

(async()=>{
  print(dm('Starting KaustubApplication using Java 21'));
  await sleep(450);print(dm('Tomcat started on port 8080 (http)'));
  await sleep(450);print(`${k('Welcome.')} Type ${k('/help')} for commands. Running it for you:`);
  await sleep(500);
  row.classList.remove('off');inp.focus();
  await typeInto('/help',140);await sleep(450);
  const v=inp.value;inp.value='';row.classList.add('off');
  await run(v,true);
  row.classList.remove('off');busy=false;inp.focus();
})();
