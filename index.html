<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kaustub@api: ~</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>⚡</text></svg>">
<style>
:root{--bg:#0B1220;--panel:#101a2e;--fg:#E6EDF3;--dim:#7d8aa0;--g:#6DB33F;--t:#00C2A8;--r:#F2495C;--a:#FFB020;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f3f5f7;--panel:#ffffff;--fg:#1f2328;--dim:#5b6472;--g:#2c7a1c;--t:#00796b;--r:#c0182f;--a:#9a5b00;color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);transition:background .4s,color .4s}
body{font:16px/1.5 ui-monospace,SFMono-Regular,"Cascadia Code",Consolas,Menlo,monospace;display:flex;justify-content:center;align-items:stretch;padding:12px}
#term{width:100%;max-width:900px;display:flex;flex-direction:column;background:var(--panel);border:1px solid color-mix(in srgb,var(--fg) 14%,transparent);border-radius:10px;overflow:hidden;transition:background .4s}
#bar{display:flex;align-items:center;gap:7px;padding:9px 14px;border-bottom:1px solid color-mix(in srgb,var(--fg) 12%,transparent);color:var(--dim);font-size:13px}
#bar i{width:11px;height:11px;border-radius:50%;background:var(--r)}#bar i:nth-child(2){background:var(--a)}#bar i:nth-child(3){background:var(--g)}
#bar span{margin-left:8px}
#scr{flex:1;overflow-y:auto;padding:14px 16px 20px;cursor:text}
.l{white-space:pre-wrap;word-break:break-word;min-height:1.5em}
.p{color:var(--g);font-weight:700}.pa{color:var(--t)}.k{color:var(--t)}.d{color:var(--dim)}.e{color:var(--r)}.w{color:var(--a)}.ok{color:var(--g)}
a{color:var(--t)}
.tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:6px 0}.nd{border:1px solid color-mix(in srgb,var(--fg) 25%,transparent);border-radius:4px;padding:0 7px;font-size:13px;color:var(--dim);transition:all .25s}.nd.on{border-color:var(--t);color:var(--t);box-shadow:0 0 10px color-mix(in srgb,var(--t) 50%,transparent)}.nd.ok{border-color:var(--g);color:var(--g)}.nd.bad{border-color:var(--r);color:var(--r);box-shadow:0 0 10px color-mix(in srgb,var(--r) 50%,transparent)}.ar{color:var(--dim)}
#row{display:flex;gap:0;align-items:center}
#row.off{display:none}
#inp{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;caret-color:var(--g);padding:0}
#fl{position:fixed;inset:0;background:#39ff6a;opacity:0;pointer-events:none;z-index:9}
#fl.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:0}25%{opacity:.85}100%{opacity:0}}
.glitch{animation:gl .8s steps(2,end)}
.glitch .l{text-shadow:3px 0 var(--r),-3px 0 #4aa8ff}
@keyframes gl{0%{transform:translate(0)}20%{transform:translate(-6px,2px) skewX(4deg)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,4px) skewX(-5deg)}80%{transform:translate(6px,0)}100%{transform:translate(0)}}
@keyframes fall{to{transform:translateY(110vh) rotate(7deg);opacity:0}}
#term.crt{animation:crt .9s ease-in forwards}
@keyframes crt{0%{transform:scale(1,1);filter:brightness(1)}55%{transform:scale(1,.012);filter:brightness(5)}100%{transform:scale(0,.012);filter:brightness(9)}}
@media (max-width:600px){body{padding:6px}#scr{padding:12px}}
@media (prefers-reduced-motion:reduce){.glitch,#term.crt{animation-duration:.01s}}
</style>

<body>
<div id="fl"></div>
<main id="term" aria-label="Terminal">

  <div id="scr"><div id="out" aria-live="polite"></div>

  </div>

<script>
const $=id=>document.getElementById(id);
const out=$('out'),inp=$('inp'),row=$('row'),scr=$('scr'),term=$('term');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const k=s=>`<span class="k">${s}</span>`,dm=s=>`<span class="d">${s}</span>`;
const RESUME_URL=''; /* paste your resume link here */
let hist=[],hi=0,dead=false,busy=true,tokens=6,last=Date.now();
let jwt=null,role=null;
const LAYERS=['Client','Filter chain','Controller','Service','Repository','PostgreSQL'];
const TXT={200:'OK',401:'Unauthorized',403:'Forbidden',404:'Not Found',405:'Method Not Allowed'};
function auth(lc){
  if(lc==='logout'){jwt=role=null;print(dm('Token discarded. You are anonymous again.'));return}
  role=lc==='login admin'?'ADMIN':'USER';
  jwt='eyJhbGciOiJIUzI1NiJ9.'+btoa(JSON.stringify({sub:'visitor',role})).replace(/=/g,'')+'.sig';
  print(`<span class="ok">200 OK</span> POST /login → JWT issued (role ${k(role)})`);
  print(dm(jwt.slice(0,44)+'…'));
  print(dm('Requests now carry the token. Try: curl localhost:8080/api/admin'));
}
async function trace(m,path,steps,status,body){
  const id='tr'+Date.now();
  print(`${dm('→')} ${k(m)} ${esc(path)} ${dm('(Authorization: '+(jwt?'Bearer …':'none')+')')}`);
  print(`<div class="tr" id="${id}">`+LAYERS.map(n=>`<span class="nd">${n}</span>`).join('<span class="ar">→</span>')+'</div>');
  const nodes=[...document.querySelectorAll('#'+id+' .nd')];
  nodes[0].classList.add('on');
  let last=0;
  for(const s of steps){
    await sleep(420);
    nodes[s.l].classList.add(s.bad?'bad':'on');
    print(`  ${dm('['+LAYERS[s.l].toLowerCase()+']')} ${s.log}`,s.bad?'e':'');
    last=s.l;if(s.bad)break;
  }
  await sleep(350);
  for(let i=last;i>=0;i--){const n=nodes[i];if(!n.classList.contains('bad')){n.classList.remove('on');if(status<400)n.classList.add('ok')}await sleep(140)}
  print(`<span class="${status<400?'ok':'e'}">HTTP/1.1 ${status} ${TXT[status]}</span>`);
  print(esc(JSON.stringify(body)));
}
async function curl(cmd){
  const t=cmd.split(/\s+/).slice(1);let m='GET',u='';
  for(let i=0;i<t.length;i++){const a=t[i];if(a==='-X'||a==='--request')m=(t[++i]||'GET').toUpperCase();else if(a==='-H'||a==='-d'||a==='--data')i++;else if(!a.startsWith('-'))u=a}
  const p=(u.replace(/^https?:\/\//,'').replace(/^localhost:8080/,'').replace(/\/+$/,'')||'/').toLowerCase();
  const f=jwt?`JwtAuthFilter: token valid, role ${k(role)}`:'JwtAuthFilter: public route, no token needed';
  const deny=need=>{if(!jwt)return [[{l:1,log:'JwtAuthFilter: no Authorization header → reject',bad:1}],401,{error:'Unauthorized'}];if(need&&role!==need)return [[{l:1,log:`JwtAuthFilter: token valid, but role ${role} lacks ${need} → reject`,bad:1}],403,{error:'Forbidden'}];return null};
  const names=['Vaultify','URL Shortener','Task Manager','API Rate Limiter','Prompt-to-App AI Platform'];
  const ro=m!=='GET'&&(['/health','/api/skills','/api/projects'].includes(p)||p.startsWith('/api/projects/'));
  let r;
  if(ro)r=deny('ADMIN')||[[{l:1,log:f},{l:2,log:`${m} is not mapped on this route → 405`,bad:1}],405,{error:'Method Not Allowed'}];
  else if(p==='/health')r=[[{l:1,log:f},{l:2,log:'HealthEndpoint.health()'}],200,{status:'UP'}];
  else if(p==='/api/skills')r=[[{l:1,log:f},{l:2,log:'SkillController.list()'},{l:3,log:'SkillService.findAll()'},{l:4,log:'SkillRepository.findAll()'},{l:5,log:'SELECT * FROM skills → 4 rows'}],200,{language:['Java','C','Python','SQL'],framework:['Spring Boot','Spring Security','JPA/Hibernate'],data:['PostgreSQL','Redis'],agents:['Google ADK','A2A']}];
  else if(p==='/api/projects')r=[[{l:1,log:f},{l:2,log:'ProjectController.list()'},{l:3,log:'ProjectService.findAll()'},{l:4,log:'ProjectRepository.findAll()'},{l:5,log:'SELECT * FROM projects → 5 rows'}],200,names];
  else if(p.startsWith('/api/projects/')){
    const key=p.slice(14),pk=ALIAS[key]||key;
    if(PROJ[pk])r=[[{l:1,log:f},{l:2,log:`ProjectController.get("${esc(key)}")`},{l:3,log:'ProjectService.find()'},{l:4,log:'ProjectRepository.findByName()'},{l:5,log:'SELECT * FROM projects WHERE name = ? → 1 row'}],200,{project:key,hint:'run: project '+key}];
    else r=[[{l:1,log:f},{l:2,log:`ProjectController.get("${esc(key)}")`},{l:3,log:'ProjectService throws ProjectNotFoundException, @RestControllerAdvice maps it to 404',bad:1}],404,{error:'Project not found'}];
  }
  else if(p==='/api/admin')r=deny('ADMIN')||[[{l:1,log:f},{l:2,log:'AdminController.panel()'},{l:3,log:'AdminService.secret()'},{l:4,log:'AdminRepository.find()'},{l:5,log:'SELECT message FROM admin → 1 row'}],200,{message:'You found the admin panel. Now go email me.'}];
  else r=[[{l:1,log:f},{l:2,log:'DispatcherServlet: no handler mapped → 404',bad:1}],404,{error:'Not Found'}];
  await trace(m,p,...r);
}

function print(h,c){const d=document.createElement('div');d.className='l '+(c||'');d.innerHTML=h;out.appendChild(d);scr.scrollTop=scr.scrollHeight}
function take(){const n=Date.now();tokens=Math.min(6,tokens+(n-last)/1500);last=n;if(tokens>=1){tokens--;return true}return false}
async function typeInto(t,ms=70){for(const ch of t){inp.value+=ch;await sleep(ms+Math.random()*40)}}

const CMDS=['help','/help','skills','whoami','projects','project','experience','achievements','contact','resume','neofetch','history','clear','docker ps','redis-cli ping','login','login admin','logout','curl localhost:8080/api/projects','curl localhost:8080/api/skills','curl localhost:8080/api/admin','curl localhost:8080/health','revelio'];
const SPELLS=['lumos','nox','avada kedavra','reparo','accio resume','obliviate','crucio','imperio','sorting hat'];

const PROJ={
vaultify:`${k('Vaultify')}  secure personal finance backend
stack   Java · Spring Boot · Spring Security · PostgreSQL · JPA/Hibernate
design  Controller → Service → Repository, JWT auth + RBAC
detail  CRUD for transactions, categories, profiles; centralized validation
        and exception handling; indexed queries
repo    <a href="https://github.com/Kaustub593S/Vaultify" target="_blank" rel="noopener">github.com/Kaustub593S/Vaultify</a>`,

stack   React · Lovable
detail  turns natural-language requirements into web app architectures and code;
        agentic workflow for planning, generation and iterative refinement
repo    <a href="https://github.com/Kaustub593S?tab=repositories" target="_blank" rel="noopener">github.com/Kaustub593S</a>`,
ratelimiter:`${k('API Rate Limiter')}  token bucket middleware
stack   Java · Spring Boot · Redis
detail  token bucket algorithm, Redis for distributed state, request-interception
        middleware. The limiter on this page is the same idea in JS: try spamming.
repo    <a href="https://github.com/Kaustub593S?tab=repositories" target="_blank" rel="noopener">github.com/Kaustub593S</a>`
};
const ALIAS={'url shortener':'urlshortener','url':'urlshortener','task manager':'taskmanager','tasks':'taskmanager','prompt-to-app':'promptapp','prompt':'promptapp','rate limiter':'ratelimiter','limiter':'ratelimiter'};

const H={
help:()=>print(`${k('Commands')}
  ${k('skills')}         tech stack by layer
  ${k('whoami')}         who is this
  ${k('projects')}       what I've built (${k('project &lt;name&gt;')} for details)
  ${k('experience')}     work log
  ${k('achievements')}   open source, contests, scholarships
  ${k('contact')}        get in touch
  ${k('resume')}         resume
  ${k('curl localhost:8080/api/projects')}  send a request through the Spring layers
  ${k('curl localhost:8080/api/admin')} · ${k('login')} · ${k('login admin')} · ${k('logout')}
  ${k('curl localhost:8080/health')}
  ${k('neofetch')} · ${k('history')} · ${k('clear')}
  ${k('Tab')} completes, ${k('↑ ↓')} walks history
${dm('Some commands are not listed. Try spells.')}`),
skills:()=>print(`${k('Language')}    Java · C · Python · SQL
${k('Framework')}   Spring Boot · Spring Security · Spring Data JPA/Hibernate
${k('API')}         REST design, JWT + RBAC, Postman, centralized error handling

${k('Cloud')}       Google Cloud

  <span class="k">"focus"</span>: ["Distributed systems", "REST API design", "Agentic AI"],

projects:()=>print(`${k('Vaultify')}                 secure personal finance backend

${k('KIIT')}             Merit-Based Scholarship
${k('HackerRank')}       Java certification`),
contact:()=>print(`POST /contact
  ${k('email')}     <a href="mailto:mailtokaustubgairola@gmail.com">mailtokaustubgairola@gmail.com</a>
  ${k('linkedin')}  <a href="https://www.linkedin.com/in/kaustub-gairola/" target="_blank" rel="noopener">linkedin.com/in/kaustub-gairola</a>

${dm('HTTP/1.1 201 Created. Looking forward to your message.')}`),
resume:()=>RESUME_URL?print(`Resume: <a href="${RESUME_URL}" target="_blank" rel="noopener">open PDF</a>`):print(`Resume is available on request: <a href="mailto:mailtokaustubgairola@gmail.com">email me</a>.`),
neofetch:()=>print(`${k('kaustub')}@${k('api')}
-----------

${k('Agents')}  Google ADK · A2A
${k('Shell')}   kaustub-sh 1.0 (token-bucket edition)`),
history:()=>hist.length?hist.forEach((c,i)=>print(`${dm(String(i+1).padStart(3))}  ${esc(c)}`)):print(dm('empty')),
'docker ps':()=>print(`${dm('CONTAINER       IMAGE            STATUS')}

'curl localhost:8080/health':()=>print(`{ <span class="k">"status"</span>: "<span class="ok">UP</span>", <span class="k">"components"</span>: { <span class="k">"db"</span>: "UP", <span class="k">"coffee"</span>: "LOW" } }`),
revelio:()=>print(`${k('Revelio!')} Hidden spells revealed:
  ${SPELLS.map(k).join(' · ')}
${dm('Light mode is a crime. You have been warned.')}`)
};
H['/help']=H.help;

/* spells */
const spells={
async lumos(){document.documentElement.dataset.theme='light';print(`✨ ${k('Lumos!')} Light mode enabled.`);print(`⚠ WARNING: Light mode is a crime.`,'w');print(`  For Merlin's sake, your eyes. Type ${k('nox')} to be forgiven.`,'w')},
async nox(){document.documentElement.dataset.theme='dark';print(`${k('Nox.')} Darkness restored. The Ministry forgives you.`)},
async 'accio resume'(){print(`${k('Accio resume!')} 📄 flying in…`);H.resume()},
async 'sorting hat'(){print(`🎩 Hmm… plenty of loyalty to PostgreSQL, a mind for distributed systems,`);print(`   and a worrying tolerance for System.out.println.`);print(`   Better be ${k('GRYFFINDOR')}. (Backend House, naturally.)`)},
async obliviate(){hist=[];out.innerHTML='';print(dm('What were we talking about?'))},
async crucio(){scr.classList.add('glitch');print(`${k('Crucio!')} <span class="e">500 Internal Server Error</span>`);await sleep(850);scr.classList.remove('glitch');print(dm('Pain is temporary. Pushed code is forever.'))},

async imperio(){print(`${k('Imperio!')} <span class="w">Your keyboard is no longer yours…</span>`);inp.value='';await typeInto('sudo hire kaustub',80);await sleep(500);const c=inp.value;inp.value='';await run(c,true)},
async 'avada kedavra'(){await avada()}
};
const SPELLKEYS=Object.keys(spells);

async function avada(){
  busy=true;row.classList.add('off');
  print(`${k('Avada Kedavra!')}`,'ok');
  const f=$('fl');f.classList.add('go');await sleep(500);f.classList.remove('go');
  scr.classList.add('glitch');await sleep(800);scr.classList.remove('glitch');
  const ls=[...out.children];
  ls.forEach((el,i)=>{el.style.animation=`fall .9s ${Math.min(i*30,900)}ms ease-in forwards`});
  await sleep(900+Math.min(ls.length*30,900));
  term.classList.add('crt');await sleep(950);
  out.innerHTML='';term.style.visibility='hidden';await sleep(700);
  term.classList.remove('crt');term.style.visibility='';
  dead=true;
  print('410 Gone. Terminal is dead.','e');print(`Type ${k('reparo')} to bring it back.`);
  row.classList.remove('off');busy=false;inp.focus();
}
async function revive(){dead=false;out.innerHTML='';print(`${k('Reparo!')} Terminal restored. <span class="ok">200 OK</span>`);print(dm('Type /help.'))}

async function run(raw,auto){
  const cmd=raw.trim(),lc=cmd.toLowerCase().replace(/\s+/g,' ');
  print(`<span class="p">kaustub@api</span>:<span class="pa">~</span>$ ${esc(cmd)}`);
  if(!cmd)return;
  if(!auto)hist.push(cmd);hi=hist.length;
  if(dead){lc==='reparo'?await revive():print(`410 Gone. Try ${k('reparo')}.`,'e');return}
  if(!auto&&!take()){print(`<span class="e">429 Too Many Spells.</span> Token bucket empty, refills 1 token every 1.5s.`);return}
  if(lc==='clear'||lc==='cls'){out.innerHTML='';return}
  if(spells[lc]){await spells[lc]();return}
  if(lc==='login'||lc==='login admin'||lc==='logout'){auth(lc);return}
  if(lc.startsWith('curl ')){await curl(cmd);return}
  if(H[lc]){H[lc]();return}
  if(lc.startsWith('project ')){const key=lc.slice(8).trim();const p=PROJ[ALIAS[key]||key];p?print(p):print(`<span class="e">404 Project Not Found.</span> Try ${k('projects')}.`);return}
  if(lc==='sudo hire kaustub'){print(`<span class="ok">200 OK.</span> Imperius curse accepted. Candidate hired. ${dm('(Offer letter pending HR.)')}`);return}
  if(lc.startsWith('sudo')){print(`<span class="e">403 Forbidden.</span> You are not in the sudoers file. This incident will be reported.`);return}
  if(/rm\s+-rf/.test(lc)){print(`Nice try. The Ministry of Magic has been notified.`,'e');return}
  if(lc==='ls'){print('skills  projects  experience  achievements  contact');return}
  if(lc==='exit'){print(dm('exit: too many open loops, cannot exit'));return}
  const near=[...CMDS,...SPELLKEYS].find(c=>c.startsWith(lc.slice(0,3))&&lc.length>=3);
  print(`<span class="e">404 Spell Not Found:</span> ${esc(cmd)}${near?` ${dm('Did you mean')} ${k(near)}${dm('?')}`:''}`)
}

inp.addEventListener('keydown',async e=>{
  if(busy&&e.key!=='Tab')return;
  if(e.key==='Enter'){e.preventDefault();const v=inp.value;inp.value='';busy=true;row.classList.add('off');await run(v,false);if(!dead||true){row.classList.remove('off');busy=false;inp.focus()}}
  else if(e.key==='ArrowUp'){e.preventDefault();if(hi>0)inp.value=hist[--hi]}
  else if(e.key==='ArrowDown'){e.preventDefault();hi<hist.length-1?inp.value=hist[++hi]:(hi=hist.length,inp.value='')}
  else if(e.key==='Tab'){e.preventDefault();const v=inp.value.toLowerCase();if(!v)return;const m=[...CMDS,...SPELLKEYS].filter(c=>c.startsWith(v));if(m.length===1)inp.value=m[0];else if(m.length>1)print(m.map(k).join('  '))}
  else if(e.key==='l'&&e.ctrlKey){e.preventDefault();out.innerHTML=''}
});
scr.addEventListener('click',()=>{if(!getSelection().toString())inp.focus()});

(async()=>{
  print(dm('Starting KaustubApplication using Java 21'));
  await sleep(450);print(dm('Tomcat started on port 8080 (http)'));
  await sleep(450);print(`${k('Welcome.')} Type ${k('/help')} for commands. Running it for you:`);
  await sleep(500);
  row.classList.remove('off');inp.focus();
  await typeInto('/help',140);await sleep(450);
  const v=inp.value;inp.value='';row.classList.add('off');
  await run(v,true);
  row.classList.remove('off');busy=false;inp.focus();
})();
</script>
